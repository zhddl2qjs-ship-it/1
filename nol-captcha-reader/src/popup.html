<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>NOL 캡차 자동 입력</title></head>
<body>
  <header><span class="logo" aria-hidden="true">N</span><div><h1>캡차 자동 입력</h1><p>NOL 예매 · 기기 내 문자 인식</p></div></header>
  <main>
    <label class="setting"><span>자동 인식 및 입력</span><input id="enabled" type="checkbox" role="switch"></label>
    <label class="setting"><span>입력완료 자동 클릭</span><input id="autoSubmit" type="checkbox" role="switch"></label>
    <label class="setting"><span>실패하면 새 문자로 재시도</span><input id="autoRetry" type="checkbox" role="switch"></label>
    <label class="setting"><span>최대 재시도 횟수</span><input id="maxRetries" type="number" min="0" max="20" step="1" value="5"></label>
    <section aria-live="polite"><span class="label">현재 상태</span><p id="status">확인 중…</p><output id="result"></output></section>
    <button id="retry" type="button" disabled>자동 처리 다시 시작</button>
    <p class="hint">실패하면 설정한 횟수만큼 새 문자로 재시도합니다. 직접 입력하면 자동 처리를 멈춥니다.</p>
  </main>
  <footer>대상: tickets.interpark.com<br>설치 후 열려 있던 예매 페이지를 새로고침하세요.</footer>
  <script src="popup.js"></script>
</body>
</html>
